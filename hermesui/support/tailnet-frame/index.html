<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Wizard OS app</title>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f7f7f4;color:#181818;font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    iframe{display:block;width:100%;height:100%;border:0;background:#f7f7f4}
    iframe[hidden]{display:none}
    .status{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:#f7f7f4;text-align:center;padding:24px}
    .status[hidden]{display:none}
    .status-card{max-width:360px}
    .status-title{font-weight:700;margin:0 0 8px}
    .status-copy{color:#666;margin:0}
    .status-action{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:18px;padding:10px 16px;border-radius:9px;background:#181818;color:#fff;text-decoration:none;font-weight:650}
    .status-action[hidden]{display:none}
    .manual-browser{position:fixed;z-index:3;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:inline-flex;align-items:center;min-height:40px;padding:8px 12px;border:1px solid #d8d8d2;border-radius:9px;background:rgba(247,247,244,.94);color:#181818;text-decoration:none;font-size:13px;font-weight:650;box-shadow:0 3px 14px rgba(0,0,0,.12);backdrop-filter:blur(8px)}
    .manual-browser[hidden]{display:none}
    @media(prefers-color-scheme:dark){html,body,iframe,.status{background:#111;color:#f5f5f0}.status-copy{color:#aaa}.status-action{background:#f5f5f0;color:#111}.manual-browser{border-color:#343434;background:rgba(17,17,17,.94);color:#f5f5f0}}
  </style>
</head>
<body>
  <div class="status" id="status" role="status">
    <div class="status-card">
      <p class="status-title" id="statusTitle">Opening app…</p>
      <p class="status-copy" id="statusCopy">Checking whether it can open inside Wizard OS.</p>
      <a class="status-action" id="browserAction" target="_blank" rel="noopener noreferrer" hidden>Open in browser</a>
    </div>
  </div>
  <a class="manual-browser" id="manualBrowserAction" target="_blank" rel="noopener noreferrer" hidden>Open in browser</a>
  <iframe id="appFrame" title="Wizard OS app" referrerpolicy="no-referrer" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
  <script>
  (async function(){
    'use strict';
    const BOOKMARK_STORAGE_KEY='hermesui.app-selector.bookmarks.v1';
    const FRAME_CHECK_PATH='/frame-check/';
    const GROUPS=new Set(['company','public']);
    const status=document.getElementById('status');
    const title=document.getElementById('statusTitle');
    const copy=document.getElementById('statusCopy');
    const action=document.getElementById('browserAction');
    const manualAction=document.getElementById('manualBrowserAction');
    const frame=document.getElementById('appFrame');
    const params=new URL(location.href).searchParams;

    function cleanDestination(candidate){
      if(!candidate||typeof candidate!=='object')return null;
      const label=typeof candidate.label==='string'?candidate.label.trim():'';
      const href=typeof candidate.href==='string'?candidate.href.trim():'';
      if(!label||label.length>48||!href)return null;
      let url;
      try{url=new URL(href);}catch(_){return null;}
      if(url.protocol!=='https:'||url.username||url.password)return null;
      return {label,href:url.href};
    }

    function readBookmark(token){
      const split=token.indexOf(':');
      if(split<1)return null;
      const group=token.slice(0,split);
      const id=token.slice(split+1);
      if(!GROUPS.has(group)||!/^[a-z0-9][a-z0-9-]{0,39}$/.test(id))return null;
      try{
        const payload=JSON.parse(localStorage.getItem(BOOKMARK_STORAGE_KEY)||'null');
        if(!payload||payload.version!==1)return null;
        const entries=Array.isArray(payload[group])?payload[group]:[];
        return cleanDestination(entries.find(item=>item&&item.id===id));
      }catch(_){return null;}
    }

    async function readPrivateApp(id){
      if(id==='private-marketplace')return {label:'Private app library',href:'https://humanitylabs.org/'};
      const response=await fetch('./apps.json',{cache:'no-store',credentials:'same-origin'});
      if(!response.ok)throw new Error('inventory unavailable');
      const payload=await response.json();
      const candidate=Array.isArray(payload.apps)?payload.apps.find(item=>item&&item.id===id):null;
      return cleanDestination(candidate);
    }

    async function frameDecision(app){
      const controller=typeof AbortController==='function'?new AbortController():null;
      const timeout=controller?setTimeout(()=>controller.abort(),6000):null;
      try{
        const endpoint=new URL(FRAME_CHECK_PATH,location.origin);
        endpoint.searchParams.set('url',app.href);
        const options={cache:'no-store',credentials:'same-origin'};
        if(controller)options.signal=controller.signal;
        const response=await fetch(endpoint.href,options);
        if(!response.ok)return null;
        const payload=await response.json();
        return payload&&payload.ok===true?payload:null;
      }catch(_){return null;}finally{if(timeout)clearTimeout(timeout);}
    }

    function notifyParent(token,mode,reason=''){
      window.parent.postMessage({
        type:'hermesui:bookmark-frame-decision',
        token,
        mode,
        reason
      },location.origin);
    }

    function showBrowserFallback(app,token,{notify=false,reason=''}={}){
      document.title=`${app.label} — browser`;
      frame.hidden=true;
      status.hidden=false;
      title.textContent='Opening in your browser';
      copy.textContent=`${app.label} does not support the in-app panel, so it is opening in a regular browser tab.`;
      action.href=app.href;
      action.hidden=false;
      manualAction.hidden=true;
      if(notify)notifyParent(token,'browser',reason);
    }

    const browserToken=params.get('browser')||'';
    const bookmarkToken=params.get('bookmark')||'';
    let app=null;
    try{
      if(browserToken)app=readBookmark(browserToken);
      else if(bookmarkToken)app=readBookmark(bookmarkToken);
      else app=await readPrivateApp(params.get('app')||'');
      if(!app)throw new Error('unknown app');
    }catch(_){
      title.textContent='App unavailable';
      copy.textContent='This destination is not in the selected Wizard OS group.';
      return;
    }

    if(browserToken){
      showBrowserFallback(app,browserToken);
      return;
    }

    if(bookmarkToken){
      const decision=await frameDecision(app);
      if(decision&&decision.mode==='browser'){
        showBrowserFallback(app,bookmarkToken,{notify:true,reason:decision.reason||''});
        return;
      }
      if(!decision||decision.mode==='unknown'){
        notifyParent(bookmarkToken,'unknown',decision&&decision.reason||'');
        manualAction.href=app.href;
        manualAction.hidden=false;
      }else{
        notifyParent(bookmarkToken,'inline',decision.reason||'');
      }
    }

    document.title=app.label;
    frame.title=app.label;
    frame.addEventListener('load',()=>{status.hidden=true;},{once:true});
    frame.src=app.href;
    setTimeout(()=>{
      if(status.hidden)return;
      title.textContent='Still connecting…';
      copy.textContent='The destination is still loading inside Wizard OS.';
    },8000);
  })();
  </script>
</body>
</html>
