name: Hermes UI overlay

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  frontend-only-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Seed optional Tailnet app inventory for clean-checkout browser tests
        run: printf '{"apps":[]}\n' > static/tailnet-apps.json
      - name: Install upstream runtime and test dependencies
        run: |
          python -m pip install -r requirements.txt pytest playwright
          python -m playwright install --with-deps chromium
      - name: Enforce untouched upstream backend
        run: python hermesui/check_boundary.py
      - name: Validate frontend and installer syntax
        run: |
          node --check static/boot.js
          node --check static/commands.js
          node --check static/login.js
          node --check static/panels.js
          node --check static/session-dashboard.js
          node --check static/session-swipe-navigation.js
          node --check static/sessions.js
          node --check static/share.js
          bash -n hermesui/installer/*.sh qa/*.sh
          shellcheck hermesui/installer/*.sh qa/*.sh
          python -m py_compile hermesui/*.py hermesui/installer/*.py
      - name: Test the custom frontend contract
        run: |
          python -m pytest -q \
            tests/test_hermes_ui_browser_conversation_lifecycle.py \
            tests/test_hermes_ui_chat_shell.py \
            tests/test_hermes_ui_boundary.py \
            tests/test_hermes_ui_cloudflare_installer.py \
            tests/test_hermes_ui_installer_runtime_identity.py \
            tests/test_hermes_ui_runtime_home_guard.py \
            tests/test_hermes_ui_mobile_session_swipe.py \
            tests/test_hermes_ui_session_dashboard.py \
            tests/test_hermes_ui_sessions_sidebar.py \
            tests/test_hermes_ui_settings_popup.py \
            tests/test_hermes_ui_upstream_compatibility.py \
            tests/test_hermesui_subpath_login.py \
            tests/test_hermesui_subpath_share.py
      - name: Test upstream conversation lifecycle through Classic view
        run: python tests/test_hermes_ui_browser_conversation_lifecycle.py
      - name: Test Tailnet composition lifecycle
        run: |
          ./qa/tailnet-installer-smoke.sh
          ./qa/update-smoke.sh
      - name: Test Cloudflare-first composition lifecycle
        run: ./qa/cloudflare-installer-smoke.sh
